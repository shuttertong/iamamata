<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d4f8b">
  <title>แผนที่น้ำท่วม</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <link href="src/style.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
</head>
<body class="public">
  <header class="bar">
    <h1 data-i18n="app.title"></h1>
    <span id="mode" class="chip chip-demo" hidden></span>
    <button id="lang" class="ghost small" type="button"></button>
  </header>
  <div id="demoBanner" class="demo-banner" hidden></div>
  <div id="map"></div>
  <div id="search" class="search"></div>
  <div id="legend" class="legend"><div id="legendItems" class="legend-items"></div></div>
  <div id="rain" class="rain"></div>
  <div class="fabs">
    <button id="floodBtn" class="fab fab-flood" type="button" data-i18n="report.startFlood"></button>
    <button id="helpBtn" class="fab fab-help" type="button" data-i18n="report.startHelp"></button>
  </div>
  <section id="sheet" class="sheet" hidden></section>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
