<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>ตรวจรายงานน้ำท่วม</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <link href="src/style.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
</head>
<body class="admin">
  <header class="bar">
    <h1 data-i18n="admin.title"></h1>
    <span id="mode" class="chip chip-demo" hidden></span>
    <button id="logout" class="ghost small" type="button" data-i18n="admin.logout" hidden></button>
    <button id="lang" class="ghost small" type="button"></button>
  </header>

  <section id="login" class="login">
    <form id="loginForm" class="card">
      <label><span data-i18n="admin.email"></span><input id="email" type="email" autocomplete="username"></label>
      <label><span data-i18n="admin.password"></span><input id="password" type="password" autocomplete="current-password"></label>
      <p id="demoHint" class="hint" data-i18n="admin.demoHint" hidden></p>
      <button class="primary" type="submit" data-i18n="admin.login"></button>
    </form>
  </section>

  <main id="main" class="review" hidden>
    <aside class="panel">
      <div class="tabs" role="tablist">
        <button id="tabQueue" role="tab" type="button"></button>
        <button id="tabHelp" role="tab" type="button"></button>
        <button id="tabEdits" role="tab" type="button"></button>
        <button id="tabAll" role="tab" type="button"></button>
        <button id="tabPlaces" role="tab" type="button"></button>
      </div>
      <div id="list" class="list"></div>
    </aside>
    <div class="mapwrap">
      <div id="map"></div>
      <div id="search" class="search"></div>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="src/admin.js"></script>
</body>
</html>
